<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول المشرفين | تبيان</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body {
    background: #f5f5f5;
}

.login-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.login-logo {
    text-align: center;
    margin-bottom: 30px;
}

.login-logo h1 {
    margin: 0;
    font-size: 38px;
}

.login-logo p {
    color: #777;
    margin-top: 5px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
}

.input-group input:focus {
    border-color: #c5a45a;
}

.login-button {
    width: 100%;
    border: none;
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
}

.login-button:hover {
    background: #222;
}

.error {
    display: none;
    background: #ffecec;
    color: #b00000;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #777;
    text-decoration: none;
}

</style>

</head>

<body>

<header>

    <div class="logo">
        تبيان
        <span>تلاوات الشيخ ياسر الدوسري</span>
    </div>

</header>


<div class="login-page">

    <div class="login-box">

        <div class="login-logo">

            <h1>تبيان</h1>

            <p>لوحة تحكم المشرفين</p>

        </div>


        <div
            id="error"
            class="error"
        >
            اسم المستخدم أو كلمة المرور غير صحيحة
        </div>


        <div class="input-group">

            <label>
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                placeholder="اكتب اسم المستخدم"
            >

        </div>


        <div class="input-group">

            <label>
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="اكتب كلمة المرور"
            >

        </div>


        <button
            class="login-button"
            onclick="login()"
        >
            تسجيل الدخول
        </button>


        <a
            href="index.html"
            class="back-home"
        >
            ← العودة للموقع
        </a>

    </div>

</div>


<script>

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    /*
        بيانات الدخول التجريبية
    */

    const adminUsername = "admin";

    const adminPassword = "123456";


    if (
        username === adminUsername &&
        password === adminPassword
    ) {

        localStorage.setItem(
            "tibyanAdminLoggedIn",
            "true"
        );

        location.href = "admin.html";

    } else {

        document.getElementById("error")
        .style.display = "block";

    }

}

</script>

</body>

</html>

</body>

</html>
