<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول المشرفين | تبيان</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #111111;
            --muted: #777777;
            --border: #e5e5e5;
            --accent: #c5a45a;
        }

        body.dark {
            --bg: #0d0f11;
            --surface: #15181b;
            --text: #f1f1f1;
            --muted: #a4a8ad;
            --border: #292e33;
            --accent: #d4b66a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg);
            color: var(--text);

            font-family: "Cairo", sans-serif;

            transition:
                background .3s,
                color .3s;
        }

        .login-box {
            width: min(420px, calc(100% - 32px));

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 22px;

            padding: 35px 30px;

            box-shadow:
                0 15px 45px rgba(0,0,0,.08);

            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: 700;
            color: var(--text);
        }

        .subtitle {
            margin-top: 3px;
            margin-bottom: 30px;

            color: var(--muted);

            font-size: 13px;
        }

        h1 {
            margin: 0 0 25px;

            font-size: 22px;
        }

        .input-group {
            text-align: right;
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            color: var(--muted);
        }

        input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--bg);
            color: var(--text);

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: border .2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            background: var(--accent);
            color: #fff;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform .15s,
                opacity .2s;
        }

        .login-button:hover {
            opacity: .9;
        }

        .login-button:active {
            transform: scale(.98);
        }

        .error {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 10px;

            background: rgba(180, 40, 40, .1);

            color: #c0392b;

            font-size: 13px;
        }

        .back {
            display: inline-block;

            margin-top: 22px;

            color: var(--muted);

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: var(--accent);
        }

    </style>
</head>


<body>

    <div class="login-box">

        <div class="logo">
            تبيان
        </div>

        <div class="subtitle">
            تلاوات الشيخ ياسر الدوسري
        </div>


        <h1>
            دخول المشرفين
        </h1>


        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    اسم المستخدم
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                تسجيل الدخول
            </button>


            <div
                id="error"
                class="error"
            >
                اسم المستخدم أو كلمة المرور غير صحيحة
            </div>

        </form>


        <a
            href="index.html"
            class="back"
        >
            العودة إلى الرئيسية
        </a>

    </div>


<script>

/*
    ================================
    بيانات الدخول
    ================================

    غيّر القيمتين إلى بياناتك.
*/

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "123456";


/*
    تسجيل الدخول
*/

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const error =
            document.getElementById("error");


        if (
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ) {

            /*
                تسجيل دخول المشرف
            */

            localStorage.setItem(
                "tibyanAdminLoggedIn",
                "true"
            );


            /*
                الانتقال إلى لوحة التحكم
            */

            window.location.href = "admin.html";

        } else {

            error.style.display = "block";

        }

    });


/*
    الوضع الداكن
*/

function applySavedTheme() {

    const saved =
        localStorage.getItem(
            "tibyanDarkMode"
        );


    if (saved === "dark") {

        document.body.classList.add("dark");

    } else {

        document.body.classList.remove("dark");

    }

}


applySavedTheme();

</script>

</body>

</html>
