<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تبيان</title>

<link rel="stylesheet" href="style.css">

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   صفحة التصنيف
========================= */

.category-page {
    max-width: 1100px;
    margin: 50px auto;
    padding: 20px;
}


/* العنوان */

.category-page h1 {
    text-align: center;
    margin-bottom: 10px;
}

.category-description {
    text-align: center;
    color: #777;
    margin-bottom: 40px;
}


/* =========================
   القوائم
========================= */

.lists {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 25px;
}


.list-card {

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow: 0 5px 20px #ddd;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}


.list-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 10px 25px #d5d5d5;
}


.list-card h2 {

    margin-top: 0;

}


.list-card p {

    color: #777;

}


/* =========================
   التلاوات
========================= */

.recitations {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 25px;
}


.recitation {

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow: 0 5px 20px #ddd;
}


.recitation img {

    width: 100%;

    height: 180px;

    object-fit: cover;
}


.recitation-content {

    padding: 20px;
}


.listen {

    display: inline-block;

    margin-top: 10px;

    background: #c5a45a;

    color: #111;

    text-decoration: none;

    padding: 10px 22px;

    border-radius: 25px;

    transition: .2s;
}


.listen:hover {

    transform: translateY(-2px);

    opacity: .9;
}


/* =========================
   زر العودة
========================= */

.back {

    display: inline-block;

    margin-bottom: 25px;

    color: #111;

    text-decoration: none;

    font-weight: 600;
}


/* =========================
   حالة عدم وجود محتوى
========================= */

.empty {

    text-align: center;

    color: #777;

    padding: 50px;

    grid-column: 1 / -1;
}


/* =========================
   الجوال
========================= */

@media (max-width: 768px) {

    .category-page {

        margin: 25px auto;

        padding: 15px;
    }


    .category-page h1 {

        font-size: 28px;
    }


    .category-description {

        font-size: 14px;

        line-height: 1.8;
    }


    .lists {

        grid-template-columns: 1fr;

        gap: 18px;
    }


    .list-card {

        padding: 25px;
    }


    .recitations {

        grid-template-columns: 1fr;

        gap: 18px;
    }


    .recitation img {

        height: 190px;
    }

}

</style>

</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header>

    <div class="logo">

        تبيان

        <span>
            تلاوات الشيخ ياسر الدوسري
        </span>

    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>


        <a href="category.html?category=tarawih">
            التراويح
        </a>


        <a href="category.html?category=haram">
            الحرم
        </a>


        <a href="category.html?category=nawader">
            النوادر
        </a>


        <!-- المقامات -->

        <a href="category.html?category=maqamat">
            المقامات
        </a>

    </nav>

</header>



<!-- =========================
     محتوى الصفحة
========================= -->

<div class="category-page">


    <a
        class="back"
        href="index.html"
    >
        ← العودة للرئيسية
    </a>


    <h1 id="categoryTitle"></h1>


    <p
        class="category-description"
        id="categoryDescription"
    ></p>


    <!-- =========================
         القوائم
    ========================== -->

    <div
        id="lists"
        class="lists"
    ></div>


    <!-- =========================
         التلاوات
    ========================== -->

    <div
        id="recitations"
        class="recitations"
        style="display: none;"
    ></div>


</div>



<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>

/* =========================
   معرفة القسم الحالي
========================= */

const params =
    new URLSearchParams(location.search);


const category =
    params.get("category");



/* =========================
   أسماء الأقسام
========================= */

const categoryNames = {

    tarawih:
        "التراويح",

    haram:
        "تلاوات الحرم",

    nawader:
        "النوادر",

    maqamat:
        "المقامات"

};



/* =========================
   أوصاف الأقسام
========================= */

const descriptions = {

    tarawih:
        "تلاوات الشيخ ياسر الدوسري في صلاة التراويح",

    haram:
        "تلاوات الشيخ من المسجد الحرام",

    nawader:
        "تلاوات نادرة وقديمة",

    maqamat:
        "تلاوات الشيخ ياسر الدوسري مرتبة حسب المقامات"

};



/* =========================
   عنوان الصفحة
========================= */

document.getElementById("categoryTitle")
    .textContent =
    categoryNames[category] || "تبيان";


document.getElementById("categoryDescription")
    .textContent =
    descriptions[category] || "";



/* =========================
   حماية النصوص
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}



/* =========================
   تحميل القوائم
========================= */

async function loadLists() {

    const listsContainer =
        document.getElementById("lists");


    const recitationsContainer =
        document.getElementById("recitations");


    listsContainer.style.display =
        "grid";


    recitationsContainer.style.display =
        "none";


    listsContainer.innerHTML = `

        <div class="empty">

            جارٍ تحميل القوائم...

        </div>

    `;


    try {


        const {
            data: lists,
            error
        } = await supabaseClient

            .from("lists")

            .select(`
                id,
                name,
                category_id
            `)

            .eq(
                "category_id",
                category
            )

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (error) {

            throw error;

        }


        listsContainer.innerHTML = "";


        /* =========================
           لا توجد قوائم
        ========================== */

        if (
            !lists ||
            lists.length === 0
        ) {

            listsContainer.innerHTML = `

                <div class="empty">

                    لا توجد قوائم في هذا القسم حتى الآن.

                </div>

            `;

            return;

        }



        /* =========================
           إنشاء بطاقات القوائم
        ========================== */

        for (const list of lists) {


            const card =
                document.createElement("div");


            card.className =
                "list-card";



            /* =========================
               عدد التلاوات
            ========================== */

            const {
                count,
                error: countError
            } = await supabaseClient

                .from("recitations")

                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )

                .eq(
                    "list_id",
                    list.id
                );


            if (countError) {

                console.error(
                    countError
                );

            }



            card.innerHTML = `

                <h2>
                    ${escapeHTML(list.name)}
                </h2>

                <p>
                    ${count ?? 0} تلاوة
                </p>

            `;


            card.onclick =
                function () {

                    showRecitations(
                        list.id
                    );

                };


            listsContainer.appendChild(
                card
            );

        }

    }

    catch (error) {

        console.error(
            "خطأ في تحميل القوائم:",
            error
        );


        listsContainer.innerHTML = `

            <div class="empty">

                حدث خطأ أثناء تحميل القوائم.

            </div>

        `;

    }

}



/* =========================
   عرض التلاوات
========================= */

async function showRecitations(listId) {

    const listsContainer =
        document.getElementById("lists");


    const container =
        document.getElementById(
            "recitations"
        );


    listsContainer.style.display =
        "none";


    container.style.display =
        "grid";


    container.innerHTML = `

        <div
            style="
                grid-column: 1 / -1;
                margin-bottom: 10px;
            "
        >

            <a
                href="#"
                class="back"
                onclick="
                    loadLists();
                    return false;
                "
            >
                ← العودة للقوائم
            </a>

            <h2>
                جارٍ تحميل التلاوات...
            </h2>

        </div>

    `;


    try {


        /* =========================
           جلب اسم القائمة
        ========================== */

        const {
            data: list,
            error: listError
        } = await supabaseClient

            .from("lists")

            .select(`
                id,
                name
            `)

            .eq(
                "id",
                listId
            )

            .single();


        if (listError) {

            throw listError;

        }



        /* =========================
           جلب التلاوات
        ========================== */

        const {
            data: recitations,
            error: recitationsError
        } = await supabaseClient

            .from("recitations")

            .select(`
                id,
                name,
                url,
                thumbnail
            `)

            .eq(
                "list_id",
                listId
            )

            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (recitationsError) {

            throw recitationsError;

        }



        /* =========================
           رأس القائمة
        ========================== */

        container.innerHTML = `

            <div
                style="
                    grid-column: 1 / -1;
                    margin-bottom: 10px;
                "
            >

                <a
                    href="#"
                    class="back"
                    onclick="
                        loadLists();
                        return false;
                    "
                >
                    ← العودة للقوائم
                </a>

                <h2>
                    ${escapeHTML(list.name)}
                </h2>

            </div>

        `;



        /* =========================
           لا توجد تلاوات
        ========================== */

        if (
            !recitations ||
            recitations.length === 0
        ) {

            container.innerHTML += `

                <div class="empty">

                    لا توجد تلاوات في هذه القائمة.

                </div>

            `;

            return;

        }



        /* =========================
           عرض التلاوات
        ========================== */

        recitations.forEach(
            function (recitation) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "recitation";


                card.innerHTML = `

                    <img
                        src="${escapeHTML(
                            recitation.thumbnail
                        )}"
                        alt=""
                    >


                    <div
                        class="recitation-content"
                    >

                        <h3>
                            ${escapeHTML(
                                recitation.name
                            )}
                        </h3>


                        <a
                            class="listen"
                            href="${escapeHTML(
                                recitation.url
                            )}"
                            target="_blank"
                            rel="noopener"
                        >
                            استمع
                        </a>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(
            "خطأ في تحميل التلاوات:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                حدث خطأ أثناء تحميل التلاوات.

            </div>

        `;

    }

}



/* =========================
   تشغيل الصفحة
========================= */

loadLists();

</script>


</body>

</html>
