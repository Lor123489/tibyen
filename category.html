<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تبيان</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

.category-page {

    max-width: 1100px;

    margin: 50px auto;

    padding: 20px;

}

.category-page h1 {

    text-align: center;

    margin-bottom: 10px;

}

.category-description {

    text-align: center;

    color: #777;

    margin-bottom: 40px;

}

.lists {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));

    gap: 25px;

}

.list-card {

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow: 0 5px 20px #ddd;

    cursor: pointer;

    transition: .2s;

}

.list-card:hover {

    transform: translateY(-5px);

}

.list-card h2 {

    margin-top: 0;

}

.list-card p {

    color: #777;

}

.recitations {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(280px, 1fr));

    gap: 25px;

}

.recitation {

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow: 0 5px 20px #ddd;

}

.recitation img {

    width: 100%;

    height: 180px;

    object-fit: cover;

}

.recitation-content {

    padding: 20px;

}

.listen {

    display: inline-block;

    margin-top: 10px;

    background: #c5a45a;

    color: #111;

    text-decoration: none;

    padding: 10px 22px;

    border-radius: 25px;

}

.back {

    display: inline-block;

    margin-bottom: 25px;

    color: #111;

    text-decoration: none;

}

.empty {

    text-align: center;

    color: #777;

    padding: 50px;

}

</style>

</head>


<body>


<header>

<div class="logo">

تبيان

<span>تلاوات الشيخ ياسر الدوسري</span>

</div>


<nav>

<a href="index.html">الرئيسية</a>

<a href="category.html?category=tarawih">التراويح</a>

<a href="category.html?category=haram">الحرم</a>

<a href="category.html?category=nawader">النوادر</a>

</nav>

</header>



<div class="category-page">

<a
class="back"
href="index.html"
>
← العودة للرئيسية
</a>


<h1 id="categoryTitle"></h1>

<p
class="category-description"
id="categoryDescription"
></p>


<div
id="lists"
class="lists"
></div>


<div
id="recitations"
class="recitations"
style="display:none"
></div>

</div>



<script>

/* =========================
   معرفة القسم الحالي
========================= */

const params =
new URLSearchParams(location.search);

const category =
params.get("category");



/* =========================
   أسماء الأقسام
========================= */

const categoryNames = {

    tarawih: "التراويح",

    haram: "تلاوات الحرم",

    nawader: "النوادر"

};


const descriptions = {

    tarawih:
    "تلاوات الشيخ ياسر الدوسري في صلاة التراويح",

    haram:
    "تلاوات الشيخ من المسجد الحرام",

    nawader:
    "تلاوات نادرة وقديمة"

};


document.getElementById("categoryTitle")
.textContent =
categoryNames[category] || "تبيان";


document.getElementById("categoryDescription")
.textContent =
descriptions[category] || "";



/* =========================
   تحميل بيانات الأدمن
========================= */

let data =
JSON.parse(
    localStorage.getItem("tibyanData")
);


if (!data) {

    data = {

        tarawih: [],
        haram: [],
        nawader: []

    };

}



/* =========================
   حماية النصوص
========================= */

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}



/* =========================
   عرض القوائم
========================= */

function showLists() {

    const listsContainer =
    document.getElementById("lists");


    const recitationsContainer =
    document.getElementById("recitations");


    recitationsContainer.style.display =
    "none";


    listsContainer.style.display =
    "grid";


    /*
       نقرأ نفس البيانات
       التي ينشئها الـ Admin
    */

    const lists =
    data[category] || [];


    listsContainer.innerHTML = "";


    if (lists.length === 0) {

        listsContainer.innerHTML = `

            <div class="empty">

                لا توجد قوائم في هذا القسم حتى الآن.

            </div>

        `;

        return;

    }


    lists.forEach(function(list) {

        const card =
        document.createElement("div");


        card.className =
        "list-card";


        card.innerHTML = `

            <h2>
                ${escapeHTML(list.name)}
            </h2>

            <p>
                ${list.recitations.length} تلاوة
            </p>

        `;


        card.onclick = function() {

            showRecitations(list.id);

        };


        listsContainer.appendChild(card);

    });

}



/* =========================
   عرض التلاوات
========================= */

function showRecitations(listId) {

    const lists =
    data[category] || [];


    let list = null;


    for (
        let i = 0;
        i < lists.length;
        i++
    ) {

        if (lists[i].id === listId) {

            list = lists[i];

            break;

        }

    }


    if (!list)
        return;


    document.getElementById("lists")
    .style.display =
    "none";


    const container =
    document.getElementById("recitations");


    container.style.display =
    "grid";


    container.innerHTML = `

        <div style="
            grid-column:1/-1;
            margin-bottom:10px;
        ">

            <a
                href="#"
                class="back"
                onclick="showLists(); return false;"
            >
                ← العودة للقوائم
            </a>

            <h2>
                ${escapeHTML(list.name)}
            </h2>

        </div>

    `;


    if (
        !list.recitations ||
        list.recitations.length === 0
    ) {

        container.innerHTML += `

            <div class="empty">

                لا توجد تلاوات في هذه القائمة.

            </div>

        `;

        return;

    }


    list.recitations.forEach(
        function(recitation) {

            container.innerHTML += `

                <div class="recitation">

                    <img
                        src="${recitation.thumbnail}"
                        alt=""
                    >

                    <div class="recitation-content">

                        <h3>
                            ${escapeHTML(
                                recitation.name
                            )}
                        </h3>

                        <a
                            class="listen"
                            href="${recitation.url}"
                            target="_blank"
                            rel="noopener"
                        >
                            استمع
                        </a>

                    </div>

                </div>

            `;

        }
    );

}



/* =========================
   تشغيل الصفحة
========================= */

showLists();

</script>

</body>

</html>
