<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم تبيان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Cairo, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 20px 8%;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    display: block;
    font-size: 12px;
    color: #aaa;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
}

.categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.category {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #ddd;
}

button {
    border: 0;
    font-family: inherit;
    cursor: pointer;
    border-radius: 10px;
    padding: 10px 18px;
}

.primary {
    background: #111;
    color: white;
}

.danger {
    background: #222;
    color: white;
}

.back {
    background: #ddd;
    margin-bottom: 20px;
}

.list {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #ddd;
}

.list h3 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-family: inherit;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 30px;
    border-radius: 20px;
}

.recitation {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.recitation img {
    width: 130px;
    height: 75px;
    object-fit: cover;
    border-radius: 10px;
}

.recitation-info {
    flex: 1;
}

</style>

</head>


<body>


<header>

<div class="logo">
    تبيان
    <span>لوحة التحكم</span>
</div>

</header>


<div class="container">


<!-- الصفحة الرئيسية للوحة التحكم -->

<div id="home">

<h1>لوحة التحكم</h1>

<p class="subtitle">
إدارة أقسام موقع تبيان
</p>


<div class="categories">


<div class="category">

<h2>التراويح</h2>

<p>
إدارة قوائم التراويح
</p>

<button
class="primary"
onclick="openCategory('tarawih')"
>
إدارة التراويح
</button>

</div>


<div class="category">

<h2>الحرم</h2>

<p>
إدارة قوائم الحرم
</p>

<button
class="primary"
onclick="openCategory('haram')"
>
إدارة الحرم
</button>

</div>


<div class="category">

<h2>النوادر</h2>

<p>
إدارة التلاوات النادرة
</p>

<button
class="primary"
onclick="openCategory('nawader')"
>
إدارة النوادر
</button>

</div>


</div>

</div>



<!-- صفحة القسم -->

<div id="categoryPage" style="display:none;">

<button
class="back"
onclick="goHome()"
>
← رجوع
</button>


<h1 id="categoryTitle"></h1>


<button
class="primary"
onclick="showCreateList()"
>
+ إنشاء قائمة
</button>


<div id="lists"></div>

</div>



<!-- صفحة القائمة -->

<div id="listPage" style="display:none;">

<button
class="back"
onclick="backToCategory()"
>
← رجوع للقوائم
</button>


<h1 id="listTitle"></h1>


<button
class="primary"
onclick="showAddRecitation()"
>
+ إضافة تلاوة
</button>


<div id="recitations"></div>

</div>


</div>



<!-- نافذة إنشاء قائمة -->

<div
id="listModal"
class="modal"
>

<div class="modal-box">

<h2>
إنشاء قائمة
</h2>


<input
id="listName"
type="text"
placeholder="مثال: رمضان 1447 هـ"
>


<button
class="primary"
onclick="createList()"
>
إنشاء
</button>


<button
onclick="closeListModal()"
>
إلغاء
</button>

</div>

</div>



<!-- نافذة إضافة تلاوة -->

<div
id="recitationModal"
class="modal"
>

<div class="modal-box">

<h2>
إضافة تلاوة
</h2>


<input
id="recitationName"
type="text"
placeholder="اسم التلاوة"
>


<input
id="youtubeUrl"
type="text"
placeholder="رابط YouTube"
>


<button
class="primary"
onclick="createRecitation()"
>
إضافة
</button>


<button
onclick="closeRecitationModal()"
>
إلغاء
</button>

</div>

</div>



<script>
    if (localStorage.getItem("tibyanAdminLoggedIn") !== "true") {
    location.href = "login.html";
}


/* =========================
   البيانات
========================= */


var data = JSON.parse(
    localStorage.getItem("tibyanData")
);


if (!data) {

    data = {

        tarawih: [],
        haram: [],
        nawader: []

    };

}


if (!data.tarawih) data.tarawih = [];
if (!data.haram) data.haram = [];
if (!data.nawader) data.nawader = [];


var currentCategory = null;
var currentList = null;



/* =========================
   حفظ
========================= */


function saveData() {

    localStorage.setItem(
        "tibyanData",
        JSON.stringify(data)
    );

}



/* =========================
   أسماء الأقسام
========================= */


function getCategoryName(category) {

    if (category === "tarawih")
        return "التراويح";

    if (category === "haram")
        return "الحرم";

    if (category === "nawader")
        return "النوادر";

    return "";

}



/* =========================
   فتح القسم
========================= */


function openCategory(category) {

    currentCategory = category;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("listPage")
        .style.display = "none";

    document.getElementById("categoryPage")
        .style.display = "block";

    document.getElementById("categoryTitle")
        .textContent =
        getCategoryName(category);

    showLists();

}



/* =========================
   الرئيسية
========================= */


function goHome() {

    document.getElementById("home")
        .style.display = "block";

    document.getElementById("categoryPage")
        .style.display = "none";

    document.getElementById("listPage")
        .style.display = "none";

}



/* =========================
   عرض القوائم
========================= */


function showLists() {

    var container =
        document.getElementById("lists");

    container.innerHTML = "";


    var lists =
        data[currentCategory];


    if (lists.length === 0) {

        container.innerHTML = `
            <p class="subtitle">
                لا توجد قوائم حتى الآن.
            </p>
        `;

        return;

    }


    for (var i = 0; i < lists.length; i++) {

        var list = lists[i];


        var div =
            document.createElement("div");

        div.className = "list";


        div.innerHTML = `

            <h3>${list.name}</h3>

            <p>
                ${list.recitations.length}
                تلاوة
            </p>

            <button
                class="primary"
                onclick="openList(${list.id})"
            >
                فتح القائمة
            </button>

            <button
                class="danger"
                onclick="deleteList(${list.id})"
            >
                حذف
            </button>

        `;


        container.appendChild(div);

    }

}



/* =========================
   فتح نافذة القائمة
========================= */


function showCreateList() {

    document.getElementById("listModal")
        .classList.add("show");

    document.getElementById("listName")
        .focus();

}



/* =========================
   إغلاق النافذة
========================= */


function closeListModal() {

    document.getElementById("listModal")
        .classList.remove("show");

}



/* =========================
   إنشاء القائمة
========================= */


function createList() {

    var name =
        document.getElementById("listName")
        .value
        .trim();


    if (name === "") {

        alert("اكتب اسم القائمة");

        return;

    }


    var newList = {

        id: Date.now(),

        name: name,

        recitations: []

    };


    data[currentCategory].push(newList);


    saveData();


    document.getElementById("listName")
        .value = "";


    closeListModal();


    showLists();

}



/* =========================
   حذف القائمة
========================= */


function deleteList(id) {

    if (!confirm("هل تريد حذف القائمة؟"))
        return;


    var lists =
        data[currentCategory];


    for (var i = 0; i < lists.length; i++) {

        if (lists[i].id === id) {

            lists.splice(i, 1);

            break;

        }

    }


    saveData();

    showLists();

}



/* =========================
   فتح القائمة
========================= */


function openList(id) {

    var lists =
        data[currentCategory];


    for (var i = 0; i < lists.length; i++) {

        if (lists[i].id === id) {

            currentList = lists[i];

            break;

        }

    }


    if (!currentList)
        return;


    document.getElementById("categoryPage")
        .style.display = "none";

    document.getElementById("listPage")
        .style.display = "block";


    document.getElementById("listTitle")
        .textContent =
        currentList.name;


    showRecitations();

}



/* =========================
   العودة للقوائم
========================= */


function backToCategory() {

    currentList = null;

    document.getElementById("listPage")
        .style.display = "none";

    document.getElementById("categoryPage")
        .style.display = "block";

    showLists();

}



/* =========================
   نافذة التلاوة
========================= */


function showAddRecitation() {

    document.getElementById("recitationModal")
        .classList.add("show");

}



/* =========================
   إغلاق نافذة التلاوة
========================= */


function closeRecitationModal() {

    document.getElementById("recitationModal")
        .classList.remove("show");

}



/* =========================
   YouTube ID
========================= */


function getYoutubeId(url) {

    var match =
        url.match(
            /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
        );


    if (match)
        return match[1];


    return null;

}



/* =========================
   إضافة التلاوة
========================= */


function createRecitation() {

    var name =
        document.getElementById("recitationName")
        .value
        .trim();


    var url =
        document.getElementById("youtubeUrl")
        .value
        .trim();


    if (name === "" || url === "") {

        alert("اكتب اسم التلاوة والرابط");

        return;

    }


    var videoId =
        getYoutubeId(url);


    if (!videoId) {

        alert("رابط YouTube غير صحيح");

        return;

    }


    currentList.recitations.push({

        id: Date.now(),

        name: name,

        url: url,

        thumbnail:
            "https://img.youtube.com/vi/"
            + videoId +
            "/hqdefault.jpg"

    });


    saveData();


    document.getElementById("recitationName")
        .value = "";

    document.getElementById("youtubeUrl")
        .value = "";


    closeRecitationModal();


    showRecitations();

}



/* =========================
   عرض التلاوات
========================= */


function showRecitations() {

    var container =
        document.getElementById("recitations");


    container.innerHTML = "";


    if (currentList.recitations.length === 0) {

        container.innerHTML = `
            <p class="subtitle">
                لا توجد تلاوات حتى الآن.
            </p>
        `;

        return;

    }


    for (
        var i = 0;
        i < currentList.recitations.length;
        i++
    ) {

        var rec =
            currentList.recitations[i];


        var div =
            document.createElement("div");

        div.className = "recitation";


        div.innerHTML = `

            <img
                src="${rec.thumbnail}"
            >

            <div class="recitation-info">

                <strong>
                    ${rec.name}
                </strong>

                <br>

                <a
                    href="${rec.url}"
                    target="_blank"
                >
                    فتح YouTube
                </a>

            </div>

        `;


        container.appendChild(div);

    }

}

</script>

</body>
</html>
