<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التلاوات | تبيان</title>

<link rel="stylesheet" href="style.css">

<style>

.tilawat-page {
    max-width: 1100px;
    margin: 50px auto;
    padding: 20px;
}

.tilawat-page h1 {
    text-align: center;
    margin-bottom: 40px;
}

.recitations {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 25px;
}

.recitation-card {

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow: 0 5px 20px #ddd;

    transition: .2s;

}

.recitation-card:hover {

    transform: translateY(-5px);

}

.recitation-card img {

    width: 100%;

    height: 180px;

    object-fit: cover;

}

.recitation-content {

    padding: 20px;

}

.recitation-content h2 {

    margin-top: 0;

}

.listen-btn {

    display: inline-block;

    background: #c5a45a;

    color: #111;

    text-decoration: none;

    padding: 10px 25px;

    border-radius: 25px;

    margin-top: 10px;

}

.empty {

    text-align: center;

    padding: 50px;

    color: #777;

}

</style>

</head>


<body>


<header>

<div class="logo">

تبيان

<span>تلاوات الشيخ ياسر الدوسري</span>

</div>


<nav>

<a href="index.html">الرئيسية</a>

<a href="tilawat.html">التلاوات</a>

<a href="admin.html">لوحة التحكم</a>

</nav>

</header>



<div class="tilawat-page">

<h1>تلاوات الشيخ ياسر الدوسري</h1>


<div
class="recitations"
id="recitations">
</div>

</div>



<script>

function getRecitations() {

    return JSON.parse(
        localStorage.getItem("tibyanRecitations")
    ) || [];

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function renderRecitations() {

    const container =
        document.getElementById("recitations");

    const recitations =
        getRecitations();


    if (recitations.length === 0) {

        container.innerHTML = `

            <div class="empty">

                لم تتم إضافة أي تلاوات حتى الآن.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    recitations.forEach(item => {

        container.innerHTML += `

            <div class="recitation-card">

                <img
                    src="${item.thumbnail}"
                    alt="${escapeHTML(item.title)}"
                >

                <div class="recitation-content">

                    <h2>
                        ${escapeHTML(item.title)}
                    </h2>

                    <a
                        class="listen-btn"
                        href="${item.youtube}"
                        target="_blank"
                        rel="noopener"
                    >
                        استمع للتلاوة
                    </a>

                </div>

            </div>

        `;

    });

}


renderRecitations();

</script>


</body>

</html>
